[general]
renderer = dx9
resolution_x = 1400
resolution_y = 900
fullscreen = false
synchro = false
anisotropic = 8
antialiasing = 0
debug = false
fill_mode = 2
show_fps = false
brightness = 1
backbuffers = 3

[lighting]
enable_shadows = true
shadowmap_size = 1024
max_spotlight_sources = 6
max_pointlight_sources = 6
max_directionallight_sources = 2

[gamepad]
dead_zone = 0.25
smooth_factor = 0.8

[mouse]
sensibility = 0.1
smoothing = 0.5

[sound]
music = 0.2
environment = 1.2
dialogue = 0.5
