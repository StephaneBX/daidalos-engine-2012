[general]
renderer = dx9
resolution_x = 1280
resolution_y = 800
internal_resolution_x = 1280
internal_resolution_y = 800
fullscreen = false
synchro = false
anisotropic = 16

[lightening]
enable_shadows = true
shadowmap_size = 1024
max_spotlight_sources = 6
max_pointlight_sources = 36
max_directionallight_sources = 4

[gamepad]
dead_zone = 0.2

[mouse]
sensibility = 0.2
smoothing = 0.5

[sound]
music = 1.0
effects = 1.0
