[general]
renderer = dx9
resolution_x = 1440
resolution_y = 900
internal_resolution_x = 1440
internal_resolution_y = 900
fullscreen = false
synchro = true
anisotropic = 16
antialiasing = 0
debug = false

[lightening]
enable_shadows = true
shadowmap_size = 2048
max_spotlight_sources = 6
max_pointlight_sources = 6
max_directionallight_sources = 4

[gamepad]
dead_zone = 0.3

[mouse]
sensibility = 0.1
smoothing = 0.5

[sound]
music = 1.0
effects = 1.0
