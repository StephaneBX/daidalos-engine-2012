    - step:
        script: # Modify the commands below to build your repository.
          - SonarQube.Scanner.MSBuild.exe begin /k:"daidalos-engine" /d:sonar.organization="stapoli-bitbucket" /d:sonar.cfamily.build-wrapper-output=bw-output /d:sonar.host.url="https://sonarcloud.io" /d:sonar.login=$SONAR_TOKEN
